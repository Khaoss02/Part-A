name: Android CI Pipeline

on:
  push:
    branches: [ "master", "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codi
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Missatge Inicial (Echo)
        run: echo "Inicia el procés"

      - name: Permisos per a Gradle
        run: chmod +x gradlew

      - name: Build del projecte
        run: ./gradlew build

      - name: Execució de Tests
        run: ./gradlew test

      - name: Missatge Final (Echo)
        run: echo "El projecte s'ha construït i els tests han passat correctament"